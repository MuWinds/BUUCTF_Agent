[workspace]
resolver = "2"
members = ["crates/agent-core", "src-tauri"]

[workspace.package]
edition = "2021"
# 1.82：`Option::is_none_or`（sink.rs 用到）自该版本起稳定。
# 由 `cargo clippy` 的 incompatible_msrv lint 把关，改动前先跑 clippy。
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "sync",
    "time",
] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
